name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android (viene preinstalado en el runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Descargar fondos de pantalla
        run: bash scripts/descargar_fondos.sh

      - name: Hoja de contactos de los fondos (para revisarlos desde el chat)
        run: |
          sudo apt-get install -y -q imagemagick >/dev/null 2>&1 || true
          cd app/src/main/assets/wallpapers
          montage -label '%f' *.jpg -tile 4x -geometry 480x270+6+6 -background '#111' -fill white -pointsize 18 ../../../../../wallpapers/preview.jpg || true
          cd "$GITHUB_WORKSPACE"
          if [ -f wallpapers/preview.jpg ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add wallpapers/preview.jpg
            git commit -q -m "Hoja de contactos de los fondos [skip ci]" || true
            git push -q origin HEAD:main || true
          fi

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar el error como comentario del commit (si falla)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Error de compilación'; echo '```'; grep -nE "^e: |error:|Error|FAILED|What went wrong|Caused by|\* Where|> Task .* FAILED" build.log | head -80; echo '--- últimas líneas ---'; tail -n 40 build.log; echo '```'; } > comentario.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comentario.md >/dev/null

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk launcher-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-tv
          path: launcher-tv.apk

      - name: Publicar como "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest -y --cleanup-tag=false 2>/dev/null || true
          gh release create latest launcher-tv.apk \
            --title "Última versión" \
            --notes "APK compilado automáticamente desde el commit ${GITHUB_SHA::7}."
