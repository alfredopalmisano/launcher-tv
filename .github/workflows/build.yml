name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android (viene preinstalado en el runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Descargar fondos de pantalla
        run: bash scripts/descargar_fondos.sh

      - name: Analizar fondos (máscaras de montaña, posición del reloj, previsualizaciones)
        run: |
          pip install -q pillow numpy
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
          python3 scripts/analizar_fondos.py app/src/main/assets/wallpapers app/src/main/assets/wallpapers wallpapers/preview
          mkdir -p wallpapers/cache
          cp app/src/main/assets/wallpapers/*.jpg app/src/main/assets/wallpapers/creditos.txt wallpapers/cache/ 2>/dev/null || true
          cp app/src/main/assets/fonts/*.ttf wallpapers/cache/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add wallpapers/preview wallpapers/cache
          git rm -q --cached wallpapers/preview.jpg 2>/dev/null || true
          git commit -q -m "Fondos, máscaras y previsualizaciones [skip ci]" || true
          git push -q origin HEAD:main || true

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar el error como comentario del commit (si falla)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Error de compilación'; echo '```'; grep -nE "^e: |error:|Error|FAILED|What went wrong|Caused by|\* Where|> Task .* FAILED" build.log | head -80; echo '--- últimas líneas ---'; tail -n 40 build.log; echo '```'; } > comentario.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comentario.md >/dev/null

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk launcher-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-tv
          path: launcher-tv.apk

      - name: Publicar como "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest -y --cleanup-tag=false 2>/dev/null || true
          gh release create latest launcher-tv.apk \
            --title "Última versión" \
            --notes "APK compilado automáticamente desde el commit ${GITHUB_SHA::7}."
